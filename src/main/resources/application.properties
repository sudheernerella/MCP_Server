spring.application.name=SudsMcp
spring.server.port=8080
# Disable web server for Standard Input/Output (stdio) communication
# Application configuration identifiers
spring.ai.mcp.server.name=github-spring-mcp
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.studio=true

# Completely silence console noise to protect the protocol stream
spring.main.web-application-type=none
spring.main.banner-mode=off

# Keep a valid pattern format but turn the console log volume completely off
logging.pattern.console=
logging.level.root=INFO
logging.level.org.springframework=INFO

# Log only to a file; stdout must carry only MCP protocol messages
logging.file.name=logs/github-mcp.log
logging.level.com.example=INFO
spring.ai.mcp.server.expose-mcp-client-tools=true
